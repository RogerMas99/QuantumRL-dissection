# RQ1: the 24 configurations of the reference study run under DQN without modification (the classical control of the reference study is the reference control).
# Generated from the manifests of the campaign: every stage lists what was run.

name = "rq1_porting"
description = "RQ1: the 24 configurations of the reference study run under DQN without modification (the classical control of the reference study is the reference control)."

[[stage]]
