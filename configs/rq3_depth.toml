# RQ3: reuploading depth, and its crossing with output reuse.
# Generated from the manifests of the campaign: every stage lists what was run.

name = "rq3_depth"
description = "RQ3: reuploading depth, and its crossing with output reuse."

[[stage]]
name = "depth_reuse_crossing"
algorithm = "dqn"
environment = "cartpole"
arms = ["hybrid_depth1_reuse16", "hybrid_depth1_reuse32", "hybrid_depth1_reuse4", "hybrid_depth1_reuse8", "hybrid_depth2_reuse16", "hybrid_depth2_reuse32", "hybrid_depth2_reuse4", "hybrid_depth2_reuse8"]
seeds = "1-10"
steps = 100000
dqn = { batch_size = 128, buffer_size = 10000, train_frequency = 10 }
terminal_adjustment = true
eval_every = 10000
eval_episodes = 20

[[stage]]
name = "depth_sweep"
algorithm = "dqn"
environment = "cartpole"
arms = ["hybrid", "hybrid_depth1", "hybrid_depth2"]
seeds = "1-10"
steps = 100000
dqn = { batch_size = 128, buffer_size = 10000, train_frequency = 10 }
terminal_adjustment = true
eval_every = 10000
eval_episodes = 5
